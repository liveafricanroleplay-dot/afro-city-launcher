name: Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle/**'
      - 'gradlew'
      - '*.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Extract supplied AFRO CITY RP source archive
        run: |
          if [ ! -f settings.gradle ] && [ -f AFRO_CITY_RP_Launcher_Source_Modified.zip ]; then
            mkdir -p /tmp/afro-source
            unzip -q AFRO_CITY_RP_Launcher_Source_Modified.zip -d /tmp/afro-source
            cp -a /tmp/afro-source/AFRO_CITY_RP_Launcher/. .
            find app/src/main/java -name 'UI.java' -type f -exec sed -i '/FirebaseCrashlytics/d' {} \;
          fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and required packages
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;25.1.8937393 cmake;3.22.1'

      - name: Validate source tree
        run: |
          test -f settings.gradle
          test -f gradlew
          test -f app/build.gradle
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afro-city-launcher-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
